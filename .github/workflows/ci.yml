name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin to Da tip (T5 bare includeBuild): implement/da-architecture-seams @ 18f951b
  WORLDSMITHS_ENGINE_REF: 18f951bff7f72f7f62cf62674da9614fd13f1948
  WORLDSMITHS_ENGINE_ROOT: ${{ github.workspace }}/engine

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout example game
        uses: actions/checkout@v7
        with:
          path: game

      - name: Checkout Worldsmiths engine (pinned SHA)
        uses: actions/checkout@v7
        with:
          repository: Worldsmiths/worldsmiths
          ref: ${{ env.WORLDSMITHS_ENGINE_REF }}
          path: engine

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Bar C gate (no direct gdx / no com.badlogic.gdx imports)
        working-directory: game
        run: bash ci/assert-bar-c.sh

      - name: Build ship archives (includeBuild engine)
        working-directory: game
        run: |
          chmod +x gradlew
          ./gradlew :desktop:distZip :web:wsItchWebZip --no-daemon

      - name: Assert ship marker in both archives
        working-directory: game
        run: bash ci/assert-ship-marker.sh

      - uses: actions/upload-artifact@v7
        with:
          name: example-basic-ship-archives
          path: |
            game/.worldsmiths/gen/desktop/build/distributions/*.zip
            game/.worldsmiths/gen/web/build/distributions/web-itch.zip
